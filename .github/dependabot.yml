# Dependabot version-update configuration for agent-collab.
#
# One ecosystem: GitHub Actions workflows. The unified plugin is stdlib-only;
# the signed native runtime is supplied by the private build/sign pipeline.
#
# Skills are markdown only — no skill-level deps to track. If a future skill
# introduces a deps file, add an entry here.
#
# Workflow tie-in (operator decision 2026-08-17): Dependabot PRs auto-merge —
# all update types — via .github/workflows/dependabot-automerge.yml (summon /
# arm / retrigger only). The merge is held by the REQUIRED validate-trace
# context: for dependabot[bot] PRs it hard-fails unless every commit is
# authentically Dependabot's (author + web-flow committer + verified
# signature) and a clean Codex response bound to the current head exists
# (scripts/dependabot_gate.py) — Codex silence or findings keep the check red
# and the PR on the manual path. Agent-authored dependency changes remain
# Tier 2/3 under docs/public-governance.md with an independent cross-family
# check.
#
# Rollback: delete this file (revert PR). Vulnerability-alerts and
# automated-security-fixes remain enabled at the repo level independently.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

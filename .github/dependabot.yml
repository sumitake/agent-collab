# Dependabot version-update configuration for agent-collab.
#
# One ecosystem: GitHub Actions workflows. The unified plugin is stdlib-only;
# the signed native runtime is supplied by the private build/sign pipeline.
#
# Skills are markdown only — no skill-level deps to track. If a future skill
# introduces a deps file, add an entry here.
#
# Workflow tie-in (deterministic no-AI design 2026-08-19): Dependabot PRs
# auto-merge via .github/workflows/dependabot-automerge.yml (arm only). The
# merge is held by the DEDICATED required context
# .github/workflows/dependabot-gate.yml (pull_request_target + ref:main), which
# hard-fails unless ALL hold: (a) every commit is authentically Dependabot's
# (author + web-flow committer + verified/valid signature); (b) every changed
# path is within .github/workflows|actions and none touches the gate's control
# plane; (c) EVERY dependency update is patch or minor via SHA-pinned
# dependabot/fetch-metadata (majors held). No AI review (the former Codex path
# was removed — no external-quota dependency). validate-trace
# (compliance-trace.yml) merely exempts dependabot from the trace.
# Agent-authored dependency changes remain Tier 2/3 under
# docs/public-governance.md with an independent cross-family check.
#
# Rollback: delete this file (revert PR). Vulnerability-alerts and
# automated-security-fixes remain enabled at the repo level independently.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    # Group only patch + minor bumps into ONE auto-mergeable PR (the gate allows
    # patch/minor); MAJOR bumps fall out to their own individual PRs, each HELD
    # by the gate for manual review. This lets safe updates auto-merge routinely
    # while majors still wait (operator direction 2026-08-19). On this PUBLIC
    # repo, CodeRabbit is available as an additional free reviewer: on-demand
    # via an `@coderabbitai review` comment, or automatically once enabled in
    # CodeRabbit's org settings (its default auto-review skips repos under 10
    # stars). Its findings block the merge via required review-thread
    # resolution. It is a bonus semantic layer, never a dependency; the
    # deterministic gate stands on its own.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

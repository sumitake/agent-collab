# Dependabot version-update configuration for agent-collab.
#
# One ecosystem: GitHub Actions workflows. The unified plugin is stdlib-only;
# the signed native runtime is supplied by the private build/sign pipeline.
#
# Skills are markdown only — no skill-level deps to track. If a future skill
# introduces a deps file, add an entry here.
#
# Workflow tie-in (operator decision 2026-08-17): Dependabot PRs auto-merge —
# all update types — via .github/workflows/dependabot-automerge.yml. Auto-merge
# arms ONLY after the summoned Codex review is submitted and every commit is
# Dependabot-authored; findings become review threads, and required
# review-thread resolution blocks the merge until each is adjudicated. The
# validate-trace required gate reports success (not skip) for
# dependabot[bot]-authored PRs (compliance-trace.yml carve-out, same decision).
# Agent-authored dependency changes remain Tier 2/3 under
# docs/public-governance.md with an independent cross-family check.
#
# Rollback: delete this file (revert PR). Vulnerability-alerts and
# automated-security-fixes remain enabled at the repo level independently.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

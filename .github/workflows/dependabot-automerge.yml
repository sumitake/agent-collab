name: Dependabot auto-merge

# Operator decision 2026-08-17: Dependabot PRs (all update types) auto-merge
# once CI is green, review threads are resolved, and — enforced INSIDE the
# required context (dependabot-gate.yml → dependabot_gate.py) — every commit is
# authentically Dependabot's and a Codex review response bound to the current
# head exists and is clean. Supersedes per-PR hand adjudication (operator
# decision 2026-08-04, plugin PR #67).
#
# Architecture (cross-family reviews 2026-08-17 — Grok r1/r2, Codex r1/r2
# integrated; reliability-baseline pass): this workflow holds NO
# merge-blocking authority. It only
#   - summon: asks Codex for a review (open/reopen/synchronize/dispatch);
#   - arm: enables native auto-merge immediately on open — SAFE because the
#     required clean-signal gate blocks the merge until a head-bound clean
#     Codex response exists (Codex silent → gate red → manual path);
#   - retrigger: when the Codex response lands (an issue comment — clean
#     results fire no review event), re-runs the failed Dependabot-gate run so
#     the gate re-evaluates without polling.
# A best-effort disarm-on-foreign-commit job was deliberately REMOVED
# (simplicity baseline): the required commit-authenticity gate is the
# authoritative control — a contaminated PR's merge can never complete, and a
# later clean force-push is a new head that demands a fresh head-bound
# signal. Redundant machinery, zero reliability gain.
#
# Keyed on the immutable PR AUTHOR (bracketed bot logins are unmintable);
# authenticity beyond the login is the required gate's job.
#
# RUNNER PLACEMENT (deliberate): these jobs need the gh CLI, absent from the
# self-hosted fleet/rhonas images (g4 gh-regression lesson). A few hosted
# minutes per Dependabot PR.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to summon a Codex review on (summon only)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  summon:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summon Codex cross-check review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@codex review"

  arm:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable native auto-merge (squash) — required gates hold the merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"

  retrigger:
    # Clean Codex results are ISSUE COMMENTS (no review event fires), so this
    # is the event that flips the required clean-signal gate green: re-run the
    # failed required-gates jobs for the PR head. issue_comment workflows run
    # from the default branch (trusted). No-op comments from anyone else are
    # filtered by the job condition.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.user.login == 'dependabot[bot]' &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed required-gates for the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request_target" \
            --jq '[.workflow_runs[] | select(.name == "Dependabot gate")] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run_id" ]; then
            echo "no pull_request_target Dependabot-gate run found for $head — nothing to retrigger"
            exit 0
          fi
          # rerun-failed-jobs 403s on a non-failed run; that is fine (gate
          # already green or still running) — do not fail the retrigger.
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun-failed-jobs" \
            && echo "re-ran failed jobs of run $run_id" \
            || echo "run $run_id not in a rerunnable failed state — skipping"

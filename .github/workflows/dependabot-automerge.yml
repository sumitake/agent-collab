name: Dependabot auto-merge

# Dependabot PRs auto-merge when the required `dependabot-gate` context is green
# (deterministic no-AI design 2026-08-19). This workflow holds NO merge
# authority — it only ARMS native auto-merge; dependabot-gate.yml (the required
# context: commit authenticity + file allowlist/control-plane hold + patch/minor
# update-type) plus the other required CI and thread resolution decide the
# actual merge.
#
# The former summon / retrigger / issue_comment / workflow_dispatch machinery
# (the Codex review path) is REMOVED: the gate is now synchronous and
# deterministic, so there is nothing async to wait for. A transient red gate is
# re-run from the Actions UI — no poll loop.
#
# TRUST MODEL: arm runs on pull_request_target with a writable token but checks
# out NO code and interpolates only the integer PR number — zero PR-controlled
# code executes (no actions/checkout, no `uses: ./`). Do NOT add a checkout.
# Keyed on the immutable PR author (dependabot[bot]).
#
# RUNNER PLACEMENT (deliberate): needs the gh CLI (absent from the self-hosted
# fleet); a couple of hosted-runner minutes per Dependabot PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  arm:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # FAIL-CLOSED arming: enabling auto-merge only makes the merge wait for
      # the CURRENTLY-required checks. If dependabot-gate is not yet a required
      # context, auto-merge would complete WITHOUT the gate. So arm ONLY when
      # dependabot-gate is provably a required status check; any API error or
      # absence → do not arm (the PR takes the normal path).
      - name: Arm native auto-merge only if the dependabot-gate context is required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type=="required_status_checks")
                        | .parameters.required_status_checks[].context]
                   | any(. == "dependabot-gate")' 2>/dev/null || echo "false")
          if [ "$required" != "true" ]; then
            echo "::warning::dependabot-gate is not a required status check on main — refusing to arm auto-merge (run scripts/enable-branch-protection.sh in the agent-collab-workspace repo; it provisions both repos). No auto-merge enabled; PR takes the normal review path."
            exit 0
          fi
          gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"

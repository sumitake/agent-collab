name: Dependabot gate

# BASE-CONTROLLED, single-event required context for Dependabot auto-merge
# (deterministic no-AI design 2026-08-19; Grok design review PROCEED-WITH-
# MODIFICATIONS integrated). Authoritative merge-blocking control for
# dependabot[bot] PRs. Replaces the retired Codex-review gate — GitHub Models,
# the intended free reviewer, was retired 2026-07-30, and this removes the
# Codex-quota dependency entirely.
#
# Trust boundary: pull_request_target runs THIS file from the base branch, and
# the explicit `ref: main` checkout runs scripts/dependabot_gate.py from
# trusted main — no PR-controlled code executes (read-only token + zero PR
# code). fetch-metadata reads PR metadata via the API; it executes no PR code.
#
# Single-event pull_request_target (not steps inside required-gates.yml, whose
# dual-event summary skip-passes a Dependabot pull_request run). The job ALWAYS
# runs so this required context is always published; non-Dependabot PRs no-op
# success — fetch-metadata is NOT run on them (it setFailed()s and would
# deadlock the required context).
#
# For dependabot[bot] PRs the gate hard-fails unless ALL hold:
#   - commits: every commit author dependabot[bot] + committer web-flow +
#     verified/valid signature (shape/sanity filter; empty list fails closed);
#   - files: every changed path within .github/workflows|actions AND no
#     control-plane file touched (the oracle must not auto-update itself);
#   - update-type: EVERY dependency update is patch or minor (majors held).
# Any failure keeps the required context red → the PR takes the manual path.
#
# Required-context membership: scripts/enable-branch-protection.sh
# (WORKSPACE_CHECKS + PLUGIN_CHECKS) — already pinned on both repos.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot-gate:
    # RUNNER PLACEMENT (deliberate): security gate on a hosted runner; must not
    # run on the self-hosted fleet.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Non-Dependabot PR — gate not applicable
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "not a dependabot[bot] PR — gate passes as not-applicable"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          # TRUST BOUNDARY: always the base branch, never PR code.
          ref: main
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        # SHA-pinned (Grok concern 3): this action's output IS the merge
        # decision, so a moved/compromised tag could auto-merge majors. A
        # Dependabot bump of this pin lives in dependabot-gate.yml, which the
        # `files` control-plane hold sends to manual review.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Commit-authenticity + file allowlist + update-type gates
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # in the plugin repo both the gate test and module live at scripts/
          # (plugin: both at scripts/). The pin test verifies these paths exist.
          python3 scripts/test_dependabot_gate.py
          python3 scripts/dependabot_gate.py commits
          python3 scripts/dependabot_gate.py files
          python3 scripts/dependabot_gate.py update-type
